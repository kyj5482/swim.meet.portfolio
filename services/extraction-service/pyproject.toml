[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swimvault-extraction"
version = "0.1.0"
description = "SwimVault extraction-service: the only AI-calling service. Extracts one child's swim results with per-field confidence."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "anthropic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools]
packages = ["app"]
