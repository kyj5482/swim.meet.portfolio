# SwimVault 로컬 오케스트레이션 — 1커맨드 기동: `docker compose up --build`
# 각 Node 서비스는 docker/node-service.Dockerfile을 SERVICE 인자로 재사용한다.
# (M0 골격: 인메모리 스토리지. DB/큐는 M1+에서 추가.)

services:
  api-gateway:
    build: { context: ., dockerfile: docker/node-service.Dockerfile, args: { SERVICE: api-gateway } }
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      AUTH_SERVICE_URL: http://auth-service:8081
      ATHLETE_SERVICE_URL: http://athlete-service:8082
      INGESTION_SERVICE_URL: http://ingestion-service:8083
      EXTRACTION_SERVICE_URL: http://extraction-service:8084
      RECORDS_SERVICE_URL: http://records-service:8085
      STANDARDS_SERVICE_URL: http://standards-service:8086
      ANALYTICS_SERVICE_URL: http://analytics-service:8087
      GAMIFICATION_SERVICE_URL: http://gamification-service:8088
      FAMILY_SERVICE_URL: http://family-service:8089
    ports: ["8080:8080"]
    depends_on: [auth-service, athlete-service, ingestion-service, extraction-service, records-service, standards-service, analytics-service, gamification-service, family-service]

  auth-service:
    build: { context: ., dockerfile: docker/node-service.Dockerfile, args: { SERVICE: auth-service } }
    environment:
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
    ports: ["8081:8081"]

  athlete-service:
    build: { context: ., dockerfile: docker/node-service.Dockerfile, args: { SERVICE: athlete-service } }
    environment: { PORT: 8082 }
    ports: ["8082:8082"]

  ingestion-service:
    build: { context: ., dockerfile: docker/node-service.Dockerfile, args: { SERVICE: ingestion-service } }
    environment: { PORT: 8083, EXTRACTION_SERVICE_URL: http://extraction-service:8084 }
    ports: ["8083:8083"]

  extraction-service:
    build: { context: ./services/extraction-service, dockerfile: ../../docker/python-service.Dockerfile }
    environment:
      PORT: 8084
      # 유일하게 LLM 키를 받는 서비스 (R5). 미설정 시 결정적 mock으로 동작.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8084:8084"]

  records-service:
    build: { context: ., dockerfile: docker/node-service.Dockerfile, args: { SERVICE: records-service } }
    environment: { PORT: 8085 }
    ports: ["8085:8085"]

  standards-service:
    build: { context: ., dockerfile: docker/node-service.Dockerfile, args: { SERVICE: standards-service } }
    environment: { PORT: 8086 }
    ports: ["8086:8086"]

  analytics-service:
    build: { context: ., dockerfile: docker/node-service.Dockerfile, args: { SERVICE: analytics-service } }
    environment: { PORT: 8087 }
    ports: ["8087:8087"]

  gamification-service:
    build: { context: ., dockerfile: docker/node-service.Dockerfile, args: { SERVICE: gamification-service } }
    environment: { PORT: 8088 }
    ports: ["8088:8088"]

  family-service:
    build: { context: ., dockerfile: docker/node-service.Dockerfile, args: { SERVICE: family-service } }
    environment: { PORT: 8089 }
    ports: ["8089:8089"]

  frontend:
    build: { context: ./frontend }
    environment: { VITE_API_BASE: http://localhost:8080 }
    ports: ["5173:5173"]
    depends_on: [api-gateway]
