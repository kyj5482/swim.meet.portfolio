name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install && npm run build && npm test
        working-directory: libs/contracts

  node-services:
    runs-on: ubuntu-latest
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - athlete-service
          - ingestion-service
          - records-service
          - standards-service
          - analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install && npm run build --if-present && npm run typecheck && npm test
        working-directory: services/${{ matrix.service }}

  extraction-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]' && pytest -q
        working-directory: services/extraction-service

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install && npm run typecheck && npm test
        working-directory: frontend
